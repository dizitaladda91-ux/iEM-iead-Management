version: "3.9"

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: iem-lms-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/iem_lms?sslmode=disable
      - DB_SSL=false
      - JWT_SECRET=${JWT_SECRET:-production_secure_jwt_secret_key_32_characters_minimum}
      - JWT_EXPIRES_IN=1d
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-production_secure_jwt_refresh_secret_key_32_characters}
      - JWT_REFRESH_EXPIRES_IN=7d
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: iem-lms-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iem_lms
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iem_lms"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/iem_lms.sql:/docker-entrypoint-initdb.d/01-iem_lms.sql:ro

volumes:
  postgres_data:
